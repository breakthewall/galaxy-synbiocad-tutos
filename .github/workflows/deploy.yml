name: Deploy MkDocs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # System dependencies required for mkdocs-bibtex (Pandoc)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-macros-plugin mkdocs-bibtex pypandoc

      # Build the site
      - name: Build site
        run: mkdocs build --strict

      # Publish to gh-pages
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
