site_name: Galaxy-SynBioCAD • Tutorials
site_description: Getting started tutorials for Galaxy-SynBioCAD tools
site_url: https://tduigou.github.io/galaxy-synbiocad-tutos/
repo_url: https://github.com/tduigou/galaxy-synbiocad-tutos
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

plugins:
  - search

markdown_extensions:
  - nl2br
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-6
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes

nav:
  - Home: index.md
  - Tutorials:
    - Pathway Design (example): tuto-2.md
    - Retrosynthesis: tuto-1-retrosynthesis.md
    - Analysis & Visualization (example): tuto-3.md
  - About: about.md