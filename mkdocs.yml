site_name: Galaxy-SynBioCAD • Tutorials
site_description: Getting started tutorials for Galaxy-SynBioCAD tools
site_url: https://tduigou.github.io/galaxy-synbiocad-tutos/
# repo_url: https://github.com/tduigou/galaxy-synbiocad-tutos
# edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

plugins:
  - search
  - macros
  - bibtex:
      bib_file: docs/refs.bib
      csl_file: docs/american-chemical-society.csl
      # csl_file: docs/ieee.csl
      # csl_file: docs/din-1505-2-alphanumeric.csl
      enable_inline_citations: true

markdown_extensions:
  - nl2br
  - admonition
  - toc:
      permalink: true
      toc_depth: 2-6
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css
  - stylesheets/icons.css
  - stylesheets/figures.css
  - stylesheets/tables.css

nav:
  - Home: index.md
  - Tutorials:
    - 1 — Retrosynthesis: tuto-1-retrosynthesis.md
    - 2 — Pathway Design: tuto-2-pathway-analysis.md
    - 3 — Genetic Design: tuto-3-genetic-design.md
  - About:
    - License: license.md